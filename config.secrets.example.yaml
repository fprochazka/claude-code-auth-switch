# Claude Code Multi-Account Profile Secrets
# Copy to ~/.claude/auth-switch.secrets.yaml — next to auth-switch.yaml — and edit.
#
# This file holds secret env values. It MUST be gitignored. The installer refuses to run when
# the file is tracked in git, or when it sits in a repository that does not ignore it.
#
# Only profiles.<name>.env is allowed here, with string values. The profile name must already
# exist in the main config. An env variable defined in both files aborts the install.

profiles:
  work:
    env:
      OTEL_EXPORTER_OTLP_HEADERS: "dd-api-key=<your-api-key>"
