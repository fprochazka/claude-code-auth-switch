# Claude Code Multi-Account Profile Configuration
# Copy to ~/.claude/auth-switch.yaml and edit
#
# Profile names are used to derive:
#   - Config dir: <profiles_dir>/<name>/
#   - Launcher: <bin_dir>/claude-<name>, which runs `cc-auth-switch start <name>`
#
# Every launch reads this file again, so env, model, add_dirs, pinned_models, default_role, refuse_home_cwd,
# capture_rate_limits and roles apply at the next launch. Re-run `cc-auth-switch install` after adding or removing a profile or changing the keys
# that it writes into the profile directory: attribution, plansDirectory, plugins and share_sessions.
#
# Secret env values belong in the sibling file auth-switch.secrets.yaml, which must be
# gitignored. See config.secrets.example.yaml.

# Source directory for shared configuration (default: ~/.claude)
source_dir: ~/.claude

# Install the claude-<name> launchers here (default: ~/.local/bin)
bin_dir: ~/.local/bin

# Create profile directories here (default: ~/.claude-profiles)
# profiles_dir: ~/.claude-profiles

# Refuse to start a session in the home directory (default: true). Claude Code would read ~/.claude/settings.json
# as the project settings of ~ and install every enabled plugin at project scope for it. A profile can override it.
# Start in ~ once with CC_AUTH_SWITCH_ALLOW_HOME=1 claude-<name>.
refuse_home_cwd: true

# Record the rate limits that Claude Code passes to the status line in <profile dir>/auth-switch-rate-limits.json, then
# run your own status line (default: true). A profile can override it, e.g. a Vertex AI one, which gets no rate limits.
capture_rate_limits: true

profiles:
  personal:
    description: "Personal Anthropic account"

  work-team:
    description: "Company team subscription"
    model: sonnet
    # Role from roles: below when the command line has no --agent-role, or `none` for no role. `--agent-role none` turns it off.
    default_role: worker
    # Pin what the sonnet/opus/haiku/fable aliases resolve to (alias -> specific version id)
    pinned_models:
      sonnet: claude-sonnet-4-5-20250929
      opus: claude-opus-4-8
    add_dirs:
      - ~/devel/projects/company
    plansDirectory: ~/.claude-profiles/work-team/plans
    # enabledPlugins and extraKnownMarketplaces are copied from ~/.claude/settings.json on every install.
    # Turn single plugins on (true) or off (false) for this profile on top of that.
    plugins:
      notes@personal-marketplace: false
    # Share sessions/ with ~/.claude/sessions, so that sessions of this profile, of other sharing
    # profiles and of plain `claude` can list and message each other. The accounts are then no longer
    # isolated from each other. Off by default; undo with `cc-auth-switch rollback-sessions work-team`.
    share_sessions: false
    attribution:
      commit: "🤖 Generated with Claude Code\n\nCo-Authored-By: Claude <noreply@anthropic.com>"
      pr: "🤖 Generated with [Claude Code](https://claude.ai/code)"
      # Keep (true) or drop (false) the `Claude-Session: <url>` trailer that web/Remote Control
      # sessions add to commits and PRs. Independent of commit/pr above. Omit to keep Claude Code's
      # default. Set false to avoid leaking session links into public repo history.
      sessionUrl: false

  work-vertexgcp:
    description: "Company via Google Cloud Vertex AI"
    add_dirs:
      - ~/devel/projects/company
    env:
      CLAUDE_CODE_USE_VERTEX: "1"
      ANTHROPIC_VERTEX_PROJECT_ID: "<your-project-id>"
      CLOUD_ML_REGION: "europe-west1"

# Roles: named sets of launch options, applied on top of any profile with `claude-<profile> --agent-role <name>`.
# Precedence: profile, then role, then your own command-line flags. List flags add up; settings are deep-merged
# into one --settings JSON together with the git config attribution and your own --settings.
roles:
  dispatcher:
    description: "Runs worker sessions in sibling tmux windows"
    prompt:
      files:                           # absolute paths, joined in this order; `file: <path>` takes one
        - /home/you/devel/claude-code-plugins/plugins/agent-roles/roles/dispatcher.md
        # - ~/.claude/roles/dispatcher-private.md   # your own additions, kept out of the public file
      mode: append                     # append -> --append-system-prompt-file, replace -> --system-prompt-file, none -> left to a hook
    model: opus                        # --model, replaces the profile's model
    effort: high                       # --effort
    permission_mode: auto              # --permission-mode
    autocompact: 250000                # --autocompact
    settings:                          # merged into the one --settings JSON
      autoCompactEnabled: true
    tools: []                          # --tools, an empty list passes no flag
    allowed_tools: []                  # --allowed-tools
    disallowed_tools: []               # --disallowed-tools
    add_dirs: []                       # --add-dir, added to the profile's
    plugin_dirs: []                    # --plugin-dir
    mcp_config: []                     # --mcp-config
    strict_mcp_config: false           # --strict-mcp-config
    agents: null                       # --agents: a mapping, a JSON string or a file path
    env: {}                            # merged over the profile's env
    extra_args: []                     # any other claude options: --flag without a value, or --flag=value

  worker:
    prompt: { file: /home/you/devel/claude-code-plugins/plugins/agent-roles/roles/worker.md, mode: append }
    settings: { autoCompactEnabled: true }
