[project]
name = "claude-code-auth-switch"
version = "0.1.0"
description = "Run several Claude Code accounts side by side with isolated credentials and shared configuration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
claude-code-auth-switch = "claude_code_auth_switch.cli:main"
claude-auth-switch-attribution = "claude_code_auth_switch.git_attribution:main"
claude-auth-switch-session-start = "claude_code_auth_switch.session_start:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
